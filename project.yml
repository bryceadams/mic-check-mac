name: MicCheck
options:
  bundleIdPrefix: dev.bryceadams
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: XQL374L3KC
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  MicCheck:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: MicCheck
        excludes: ["Resources/Info.plist"]
    info:
      path: MicCheck/Resources/Info.plist
      properties:
        CFBundleName: Mic Check
        CFBundleDisplayName: Mic Check
        LSUIElement: true
        SUFeedURL: https://raw.githubusercontent.com/bryceadams/mic-check-mac/main/appcast.xml
        SUPublicEDKey: bo1akQAFQk/gopzGnahoq89UHTFl9l71jVnhGISVgIY=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSMicrophoneUsageDescription: Mic Check listens to your input devices to show live level meters and, when you run a sound test, plays a short clip back to you. Nothing is saved or sent anywhere.
        NSHumanReadableCopyright: © 2026 Bryce Adams
    entitlements:
      path: MicCheck/Resources/MicCheck.entitlements
      properties:
        # Hardened runtime: microphone access requires this even without the sandbox.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bryceadams.MicCheck
        PRODUCT_NAME: Mic Check
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          # Keep get-task-allow out of Release builds so they can be notarized.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_DEBUG_DYLIB: NO
          # Notarization requires a secure timestamp; Xcode only adds one when archiving.
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # Universal binary so Intel Macs on macOS 15 can install and update.
          ARCHS: arm64 x86_64
          ONLY_ACTIVE_ARCH: NO
